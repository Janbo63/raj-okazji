name: Deploy Raj Okazji

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy via Native SSH
        run: |
          # Setup SSH Key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add VPS to known hosts using the fingerprint you verified
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts
          
          # Prepare directory
          ssh -i ~/.ssh/id_rsa root@${{ secrets.HOSTINGER_IP }} "mkdir -p /var/www/rajokazji-webstore"
          
          # Upload files using SCP (Native)
          # We upload dist, backend, and package.json
          scp -i ~/.ssh/id_rsa -r dist backend package.json root@${{ secrets.HOSTINGER_IP }}:/var/www/rajokazji-webstore/
          
          # Finalize on server
          ssh -i ~/.ssh/id_rsa root@${{ secrets.HOSTINGER_IP }} << 'EOF'
            cd /var/www/rajokazji-webstore
            npm install --production
            
            # Setup PM2 path
            export PATH=$PATH:/usr/local/bin
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi
            
            # Restart the app
            pm2 delete raj-okazji 2>/dev/null || true
            
            ZOHO_CLIENT_ID="${{ secrets.ZOHO_CLIENT_ID }}" \
            ZOHO_CLIENT_SECRET="${{ secrets.ZOHO_CLIENT_SECRET }}" \
            ZOHO_REFRESH_TOKEN="${{ secrets.ZOHO_REFRESH_TOKEN }}" \
            ZOHO_ORG_ID="${{ secrets.ZOHO_ORG_ID }}" \
            API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            pm2 start backend/server.js --name raj-okazji
            
            pm2 save
          EOF