name: Deploy Raj Okazji

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy via Native SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 46.202.129.30 >> ~/.ssh/known_hosts
          
          # 1. FORCE CLEANUP: Delete old dist folder to prevent stale files
          ssh -i ~/.ssh/id_rsa root@46.202.129.30 "rm -rf /var/www/rajokazji-webstore/dist"
          
          # 2. Upload build and backend
          scp -i ~/.ssh/id_rsa -r dist backend package.json root@46.202.129.30:/var/www/rajokazji-webstore/
          
          # 3. Restart server
          ssh -i ~/.ssh/id_rsa root@46.202.129.30 << 'EOF'
            cd /var/www/rajokazji-webstore
            npm install --production
            
            # Use --update-env to ensure changes to secrets/ports are applied
            pm2 delete raj-okazji-webstore || true
            
            PORT=3300 \
            ZOHO_CLIENT_ID="${{ secrets.ZOHO_CLIENT_ID }}" \
            ZOHO_CLIENT_SECRET="${{ secrets.ZOHO_CLIENT_SECRET }}" \
            ZOHO_REFRESH_TOKEN="${{ secrets.ZOHO_REFRESH_TOKEN }}" \
            ZOHO_ORG_ID="${{ secrets.ZOHO_ORG_ID }}" \
            ZOHO_REGION="${{ secrets.ZOHO_REGION }}" \
            ZOHO_GUEST_CUSTOMER_ID="${{ secrets.ZOHO_GUEST_CUSTOMER_ID }}" \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            pm2 start backend/server.js --name raj-okazji-webstore --update-env
            
            pm2 save
          EOF