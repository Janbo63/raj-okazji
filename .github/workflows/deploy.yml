
name: Deploy Raj Okazji

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy via Native SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 46.202.129.30 >> ~/.ssh/known_hosts
          
          # Sync all relevant files to the server (Source + Build)
          # We include components, pages, services, etc.
          ssh -i ~/.ssh/id_rsa root@46.202.129.30 "mkdir -p /var/www/rajokazji-webstore"
          scp -i ~/.ssh/id_rsa -r dist backend components pages services public index.html index.tsx App.tsx types.ts constants.ts vite.config.ts package.json root@46.202.129.30:/var/www/rajokazji-webstore/
          
          ssh -i ~/.ssh/id_rsa root@46.202.129.30 << 'EOF'
            cd /var/www/rajokazji-webstore
            npm install --production
            pm2 delete raj-okazji-webstore || true
            fuser -k 3300/tcp || true
            ufw allow 3300/tcp || true
            
            PORT=3300 \
            ZOHO_CLIENT_ID="${{ secrets.ZOHO_CLIENT_ID }}" \
            ZOHO_CLIENT_SECRET="${{ secrets.ZOHO_CLIENT_SECRET }}" \
            ZOHO_REFRESH_TOKEN="${{ secrets.ZOHO_REFRESH_TOKEN }}" \
            ZOHO_ORG_ID="${{ secrets.ZOHO_ORG_ID }}" \
            API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            pm2 start backend/server.js --name raj-okazji-webstore
            
            pm2 save
          EOF