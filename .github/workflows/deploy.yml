name: Deploy Raj Okazji

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Prepare VPS Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /var/www/rajokazji-webstore
            chmod 755 /var/www/rajokazji-webstore

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          target: "/var/www/rajokazji-webstore"
          source: "dist/*,backend/*,package.json"
          strip_components: 0

      - name: Restart Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/rajokazji-webstore
            npm install --production
            pm2 delete raj-okazji 2>/dev/null || true
            ZOHO_CLIENT_ID="${{ secrets.ZOHO_CLIENT_ID }}" \
            ZOHO_CLIENT_SECRET="${{ secrets.ZOHO_CLIENT_SECRET }}" \
            ZOHO_REFRESH_TOKEN="${{ secrets.ZOHO_REFRESH_TOKEN }}" \
            ZOHO_ORG_ID="${{ secrets.ZOHO_ORG_ID }}" \
            API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            pm2 start backend/server.js --name raj-okazji
            pm2 save