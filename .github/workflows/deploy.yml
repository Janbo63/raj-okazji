name: Deploy Raj Okazji

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy via Native SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts
          
          # Use a clean target directory for the app
          ssh -i ~/.ssh/id_rsa root@${{ secrets.HOSTINGER_IP }} "mkdir -p /var/www/rajokazji-webstore"
          
          # Sync files
          scp -i ~/.ssh/id_rsa -r dist backend package.json root@${{ secrets.HOSTINGER_IP }}:/var/www/rajokazji-webstore/
          
          ssh -i ~/.ssh/id_rsa root@${{ secrets.HOSTINGER_IP }} << 'EOF'
            cd /var/www/rajokazji-webstore
            npm install --production
            
            # Find PM2 path
            export PM2_PATH=$(which pm2 || echo "/usr/local/bin/pm2")
            
            # FULL RESET OF THE SPECIFIC PROCESS
            $PM2_PATH delete raj-okazji-v2 || true
            $PM2_PATH stop raj-okazji-v2 || true
            
            # ENSURE PORT 3200 IS NOT HELD BY GHOST PROCESSES
            fuser -k 3200/tcp || true
            
            PORT=3200 \
            ZOHO_CLIENT_ID="${{ secrets.ZOHO_CLIENT_ID }}" \
            ZOHO_CLIENT_SECRET="${{ secrets.ZOHO_CLIENT_SECRET }}" \
            ZOHO_REFRESH_TOKEN="${{ secrets.ZOHO_REFRESH_TOKEN }}" \
            ZOHO_ORG_ID="${{ secrets.ZOHO_ORG_ID }}" \
            API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            $PM2_PATH start backend/server.js --name raj-okazji-v2
            
            $PM2_PATH save
          EOF